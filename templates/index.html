<!DOCTYPE html>
<html>
<head>
    <title>New York Taxi Fare Predictor</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>NYC Taxi Fare Predictor</h1>
        <form method="post" action="/predict">
            <a>Your Location</a>
            <input type="text" name="Location" placeholder="eg. JFK Airport" value="{{ location or '' }}" required>
            <a>Your Destination</a>
            <input type="text" name="Destination" placeholder="eg. Metlife Stadium" value="{{ destination or '' }}" required>
            <input type="number" name="Number of Passengers" placeholder="Number of passengers" value="{{ passenger_count or '' }}" min="1" required>

            <button type="submit">Predict Fare</button>
        </form>

        {% if predictions %}
        <div class="result">
            <strong>Estimated Fare:</strong> ${{ predictions }}
        </div>
        {% endif %}
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <a class="reset" href="/">Reset</a>
    </div>
</body>
</html>
