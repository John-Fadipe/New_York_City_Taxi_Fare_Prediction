<!DOCTYPE html>
<html>
<head>
    <title>New York Taxi Fare Predictor</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        textarea {
            width: 300px;
            height: 50px;
            margin: 10px;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <h1>Check your New York Taxi fare here</h1>

    <form method="post">
        <div>
            <textarea name="Location" placeholder="Enter your current location here">{{location}}</textarea>
        </div>
        <div>
            <textarea name="Destination" placeholder="Enter your destination here">{{destination}}</textarea>
        </div>
        <div>
            <button type="submit">Check Fare</button>
            <a href="/">Reset</a>
        </div>
    </form>

    {% if location and destination %}
    <h2>Your trip is from <strong>{{ location }}</strong> to <strong>{{ destination }}</strong></h2>
    {% endif %}
</body>
</html>
